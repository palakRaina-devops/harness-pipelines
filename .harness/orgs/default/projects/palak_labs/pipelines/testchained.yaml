pipeline:
  name: test-chained
  identifier: testchained
  projectIdentifier: palak_labs
  orgIdentifier: default
  tags: {}
  variables:
    - name: Tower_URL_CHILD
      type: String
      description: ""
      required: false
      value: <+input>
  stages:
    - stage:
        name: custom
        identifier: custom
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: "echo \"TOWER URL: <+pipeline.variables.Tower_URL>\""
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
